# RevF MCUboot: unsigned SHA-256 hash TLV validation (no signing key), swap
# with revert of unconfirmed test images. No serial recovery transport exists
# on this board; recovery is over SWD.
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_SERIAL_CDC_ACM=n
CONFIG_BOOT_SERIAL_BOOT_MODE=n
# The application starts WDT31 and it keeps running across the soft reset into
# MCUboot; feed it so a long swap or revert is not interrupted.
CONFIG_BOOT_WATCHDOG_FEED=y
# The module's optional LF crystal is unconfirmed.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
