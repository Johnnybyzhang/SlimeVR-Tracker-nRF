# RevF nRF54L15 tracker. Build with -DFILE_SUFFIX=mcuboot (MCUboot + ESB OTA).

# No USB device controller or UART pins: logs and console over SWD RTT only.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=y

# nPM1304 charger/gauge sensor driver and LED0 status sink on the shared I2C bus.
CONFIG_SENSOR=y
CONFIG_LED=y
# The LED worker performs the PMIC I2C writes (measured 496 B peak of 512).
CONFIG_LED_THREAD_STACK_SIZE=1024
# Charging is indicated autonomously by the nPM1304 on the red LED (LED0).
CONFIG_LED_CHARGE_INDICATION=n

# Battery SOC from nRF Fuel Gauge with the provisional generic 80 mAh model
# (not a measured profile of the 401220 cell).
CONFIG_BATTERY_FUEL_GAUGE=y
CONFIG_BATTERY_FUEL_GAUGE_MODEL="battery_models/generic_80mAh.inc"

# The HJSIP module carries the 32.768 kHz crystal (XL1/XL2 on P1.00/P1.01),
# 9 pF / +/-20 ppm per the vendor. The calibrated RC drifted a few hundred
# ppm against the receiver, too much for 120 Hz frames.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# Power is owned by the dedicated nPM1304 SHPHLD button (2 s hold + release;
# ship mode on battery, SYSTEMOFF while charging). The MCU button reports
# clicks, double press calibrates, triple press pairs; it never reboots or
# powers off, and a long hold does nothing.
CONFIG_USER_SHUTDOWN=n
CONFIG_USER_BUTTON_REBOOT=n

CONFIG_SENSOR_ROTATION_0=y
# LIS2MDL maximum continuous rate (100 kHz shared bus: ~1 ms per read).
CONFIG_SENSOR_MAG_ODR=100
CONFIG_NPM13XX_POWER_BUTTON=y

# Keep a trial image only after it has reached the receiver; otherwise revert.
CONFIG_MCUBOOT_CONFIRM_REQUIRE_LINK=y
